<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Design & Website Auditor</title>
<meta name="description" content="Analyze your website. Understand the problems. Improve the experience. Structured audits for design, UX, SEO, AEO, accessibility and conversion.">
<meta name="theme-color" content="#171C26">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<script>
/* ── Public configuration (safe to expose). Never put AI keys here. ── */
window.AUDITOR_CONFIG = {
  SUPABASE_URL: '',        // e.g. https://abcd.supabase.co   — empty = local mode
  SUPABASE_ANON_KEY: '',   // public anon key
  AUDIT_ENDPOINT: '',      // default: SUPABASE_URL/functions/v1/audit, or /api/audit in local mode
  DEFAULT_LANG: 'auto',    // 'auto' | 'en' | 'ko'
  BRAND_NAME: 'AI Design & Website Auditor',
};
</script>
<style>
/* ═══ Design system tokens ═══ */
:root{
  --f-ui:"Instrument Sans","Pretendard Variable",Pretendard,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ed:"Newsreader","Pretendard Variable",Pretendard,Georgia,"Times New Roman",serif;
  --t1:clamp(30px,4.2vw,46px); --t1-lh:1.08;
  --t2:19px; --t2-lh:1.3;
  --t3:15px; --t3-lh:1.6;
  --meta:12.5px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:72px;
  --r-control:6px; --r-panel:10px;
  --w-read:68ch; --w-page:1160px;
  --dur:.18s;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root, :root[data-theme="dark"]{
  --bg:#171C26; --panel:#1E2430; --panel-2:#252C3A; --line:#2F3747; --line-2:#3C4557;
  --text:#E8EBF1; --muted:#8C95A7; --faint:#5E677A;
  --marker:#F0CF65; --marker-ink:#1B1A12; --marker-soft:rgba(240,207,101,.14);
  --crit:#F2555A; --high:#EE8A45; --med:#7FA8DB; --low:#8C95A7; --good:#79C7A4;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.25);
}
:root[data-theme="light"]{
  --bg:#F3F4F7; --panel:#FFFFFF; --panel-2:#F7F8FA; --line:#DDE0E6; --line-2:#C9CED7;
  --text:#1A2030; --muted:#5B6476; --faint:#8C94A3;
  --marker:#1A2030; --marker-ink:#FFFFFF; --marker-soft:rgba(226,185,59,.22);
  --crit:#C9282E; --high:#B85A12; --med:#2F5E9A; --low:#5B6476; --good:#1F7A54;
  --shadow:0 1px 2px rgba(20,24,34,.06), 0 6px 20px rgba(20,24,34,.05);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 var(--t3)/var(--t3-lh) var(--f-ui);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
img{max-width:100%;display:block}
a{color:inherit;text-decoration-color:var(--line-2);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--marker);outline-offset:2px;border-radius:3px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.t1{font:400 var(--t1)/var(--t1-lh) var(--f-ed);letter-spacing:-.01em}
.t2{font:600 var(--t2)/var(--t2-lh) var(--f-ui);letter-spacing:-.005em}
.meta{font-size:var(--meta);color:var(--muted);line-height:1.5}
.muted{color:var(--muted)}
.ed{font-family:var(--f-ed);font-size:18px;line-height:1.62}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--marker);color:var(--marker-ink);padding:8px 12px;z-index:99;border-radius:var(--r-control)}
.skip:focus{left:8px}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--r-control);border:1px solid var(--line-2);background:transparent;cursor:pointer;font-weight:500;text-decoration:none;white-space:nowrap;transition:background var(--dur),border-color var(--dur)}
.btn:hover{background:var(--panel-2);border-color:var(--faint)}
.btn.primary{background:var(--marker);border-color:var(--marker);color:var(--marker-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent}
.btn.sm{min-height:32px;padding:0 12px;font-size:13.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:grid;gap:6px}
.field label{font-size:13.5px;font-weight:500}
.input{width:100%;min-height:42px;padding:0 12px;border-radius:var(--r-control);border:1px solid var(--line-2);background:var(--panel);transition:border-color var(--dur)}
.input:focus{outline:none;border-color:var(--marker);box-shadow:0 0 0 3px var(--marker-soft)}
select.input{padding-right:28px}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:var(--w-page);margin:0 auto;padding:0 var(--s5);height:60px;display:flex;align-items:center;gap:var(--s5)}
.wordmark{display:flex;align-items:center;gap:10px;font-weight:600;text-decoration:none;white-space:nowrap}
.wordmark svg{flex:none}
.top nav{display:flex;gap:2px;margin-left:auto;align-items:center}
.top nav a{padding:6px 10px;border-radius:var(--r-control);text-decoration:none;color:var(--muted);font-size:14px}
.top nav a:hover,.top nav a[aria-current="page"]{color:var(--text);background:var(--panel)}
.lang-toggle{font-size:13px}
@media (max-width:760px){.top nav .hide-m{display:none}.top-in{gap:var(--s3);padding:0 var(--s4)}.wordmark span{display:none}}

/* Page scaffolding */
.page{max-width:var(--w-page);margin:0 auto;padding:var(--s7) var(--s5) var(--s8)}
.section{padding:var(--s8) 0;border-top:1px solid var(--line)}
.section:first-child{border-top:0}
.section-head{display:grid;gap:var(--s2);margin-bottom:var(--s6);max-width:var(--w-read)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-panel)}
.pad{padding:var(--s5)}
.stack>*+*{margin-top:var(--s4)}
.row{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.spacer{flex:1}
@media (max-width:760px){.page{padding:var(--s6) var(--s4) var(--s7)}.section{padding:var(--s7) 0}}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:var(--s7);align-items:start;padding-top:var(--s5)}
.hero h1{font:400 clamp(38px,5.6vw,64px)/1.02 var(--f-ed);letter-spacing:-.02em;max-width:12ch}
.hero .lede{font-size:18px;color:var(--muted);max-width:44ch;margin-top:var(--s5)}
.urlform{margin-top:var(--s6);display:flex;gap:0;border:1px solid var(--line-2);border-radius:var(--r-panel);background:var(--panel);padding:6px;max-width:560px;transition:border-color var(--dur),box-shadow var(--dur)}
.urlform:focus-within{border-color:var(--marker);box-shadow:0 0 0 4px var(--marker-soft)}
.urlform input{flex:1;min-width:0;border:0;background:transparent;padding:0 12px;font-size:16.5px;min-height:46px}
.urlform input:focus{outline:none}
.urlform .btn{min-height:46px}
.form-note{margin-top:var(--s3)}
.form-error{color:var(--crit);font-size:14px;margin-top:var(--s2)}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
@media (max-width:520px){.urlform{flex-direction:column;gap:6px}.urlform .btn{width:100%}}

/* ═══ Signature element: calibration scales ═══ */
.gauge{display:grid;gap:2px}
.scale-row{display:grid;grid-template-columns:minmax(118px,190px) minmax(0,1fr) 34px 44px;align-items:center;gap:var(--s3);min-height:30px}
.scale-row .name{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scale-row .val{font-weight:600;text-align:right;font-size:14px}
.scale-row .dl{font-size:12px;text-align:right}
.scale{position:relative;height:18px;
  background:
    linear-gradient(var(--line-2),var(--line-2)) 0 50%/100% 1px no-repeat,
    repeating-linear-gradient(90deg,var(--line-2) 0 1px,transparent 1px 10%) 0 50%/100% 9px no-repeat,
    repeating-linear-gradient(90deg,var(--faint) 0 1px,transparent 1px 50%) 0 50%/100% 15px no-repeat}
.scale .fill{position:absolute;left:0;top:50%;height:3px;margin-top:-1.5px;width:calc(var(--v)*1%);background:var(--text);opacity:.55;border-radius:2px;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.scale .mark{position:absolute;top:0;bottom:0;width:3px;left:calc(var(--v)*1% - 1.5px);background:var(--marker);border-radius:1px;transition:left .9s cubic-bezier(.2,.7,.2,1)}
.scale .ghost{position:absolute;top:3px;bottom:3px;width:0;left:calc(var(--p)*1%);border-left:2px dotted var(--muted)}
.scale.na{background:linear-gradient(90deg,var(--line) 50%,transparent 0) 0 50%/8px 1px repeat-x}
.scale.pre .fill{width:0}.scale.pre .mark{left:-1.5px}
.scale-legend{display:grid;grid-template-columns:minmax(118px,190px) minmax(0,1fr) 34px 44px;gap:var(--s3);font-size:11px;color:var(--faint)}
.scale-legend div{display:flex;justify-content:space-between}
.conf{font-size:11px;color:var(--faint);margin-left:4px}
@media (max-width:520px){.scale-row,.scale-legend{grid-template-columns:96px minmax(0,1fr) 28px 36px;gap:var(--s2)}}
@media (prefers-reduced-motion:reduce){.scale .fill,.scale .mark{transition:none}}

.specimen{padding:var(--s5)}
.specimen-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4);padding-bottom:var(--s3);border-bottom:1px solid var(--line)}
.overall-num{font:400 64px/1 var(--f-ed);letter-spacing:-.03em}
.overall-num small{font:500 15px var(--f-ui);color:var(--muted);letter-spacing:0;margin-left:4px}

/* Steps / lists */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s5);counter-reset:s}
.steps li{list-style:none;padding-top:var(--s4);border-top:2px solid var(--line-2)}
.steps li:first-child{border-top-color:var(--marker)}
.steps .n{font:400 30px/1 var(--f-ed);color:var(--muted);display:block;margin-bottom:var(--s3)}
.steps ol{padding:0;margin:0}
@media (max-width:760px){.steps{grid-template-columns:1fr}}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--s6);margin:0}
.cats>div{display:grid;grid-template-columns:150px 1fr;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.cats dt{font-weight:600}.cats dd{margin:0;color:var(--muted);font-size:14px}
@media (max-width:760px){.cats{grid-template-columns:1fr}.cats>div{grid-template-columns:1fr;gap:2px}}

.ba{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5)}
.ba figure{margin:0}.ba figcaption{margin-top:var(--s3)}
.wf{aspect-ratio:16/10;border:1px solid var(--line);border-radius:var(--r-panel);background:var(--panel);padding:7%;display:grid;align-content:start;gap:6%}
.wf i{display:block;background:var(--line-2);border-radius:3px;height:8px}
.wf .h{height:18px;width:70%}.wf .h.sm{height:12px;width:55%}
.wf .b{height:26px;width:28%;border-radius:4px}
.wf .b.alt{background:transparent;border:1px solid var(--line-2)}
.wf .b.on{background:var(--marker)}
.wf .r{display:flex;gap:5%}
.wf .r i{flex:1;height:26px}
@media (max-width:640px){.ba{grid-template-columns:1fr}}

.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s6) var(--s5)}
.feat h3{margin-bottom:var(--s2)}
@media (max-width:760px){.feat{grid-template-columns:1fr}}

/* Pricing */
.plans{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r-panel);overflow:hidden;background:var(--panel)}
.plan{padding:var(--s5);display:flex;flex-direction:column;gap:var(--s4);border-left:1px solid var(--line)}
.plan:first-child{border-left:0}
.plan.hl{background:var(--panel-2);box-shadow:inset 0 3px 0 var(--marker)}
.price{font:400 44px/1 var(--f-ed)}.price small{font:500 14px var(--f-ui);color:var(--muted)}
.plan ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px}
.plan li{padding-left:20px;position:relative}
.plan li::before{content:"";position:absolute;left:2px;top:9px;width:9px;height:5px;border-left:1.5px solid var(--good);border-bottom:1.5px solid var(--good);transform:rotate(-45deg)}
.plan li.off{color:var(--faint)}.plan li.off::before{border:0;height:1.5px;background:var(--faint);transform:none;top:11px;width:8px}
.plan .btn{margin-top:auto}
@media (max-width:860px){.plans{grid-template-columns:1fr}.plan{border-left:0;border-top:1px solid var(--line)}.plan:first-child{border-top:0}}

.faq details{border-bottom:1px solid var(--line);padding:var(--s4) 0}
.faq summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:var(--s4)}
.faq summary::after{content:"+";color:var(--muted);font-size:20px;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq p{margin-top:var(--s3);color:var(--muted);max-width:var(--w-read)}
.cta-band{display:flex;align-items:center;justify-content:space-between;gap:var(--s5);flex-wrap:wrap}
.foot{border-top:1px solid var(--line);padding:var(--s5);text-align:center}

/* App shell */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 61px)}
.side{border-right:1px solid var(--line);padding:var(--s5) var(--s3);display:flex;flex-direction:column;gap:2px;position:sticky;top:61px;height:calc(100vh - 61px)}
.side a{padding:8px 12px;border-radius:var(--r-control);text-decoration:none;color:var(--muted);font-size:14px;display:flex;gap:10px;align-items:center}
.side a:hover{background:var(--panel);color:var(--text)}
.side a[aria-current="page"]{background:var(--panel);color:var(--text);box-shadow:inset 2px 0 0 var(--marker)}
.side .usage{margin-top:auto;padding:var(--s3)}
.meter{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--marker)}
.main{padding:var(--s6) var(--s6) var(--s8);max-width:1120px;width:100%}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:var(--s2) var(--s3)}.side .usage{display:none}.main{padding:var(--s5) var(--s4) var(--s7)}}

/* Tables */
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line)}
.table td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:hover td{background:var(--panel-2)}
.table .num{text-align:right;font-weight:600}
.table-wrap{overflow-x:auto}
.empty{padding:var(--s7) var(--s5);text-align:center;display:grid;gap:var(--s3);justify-items:center}

/* Progress */
.progress{list-style:none;padding:0;margin:var(--s5) 0 0;display:grid;gap:0;max-width:560px}
.progress li{display:grid;grid-template-columns:28px 28px 1fr auto;align-items:center;gap:var(--s2);padding:12px 0;border-bottom:1px solid var(--line);color:var(--faint)}
.progress .n{font-size:12.5px}
.progress .st{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center}
.progress li.running{color:var(--text)}
.progress li.running .st{border-color:var(--marker);background:radial-gradient(circle,var(--marker) 0 4px,transparent 5px)}
.progress li.done{color:var(--muted)}
.progress li.done .st{border-color:var(--good);background:var(--good)}
.progress li.done .st::after{content:"";width:7px;height:4px;border-left:1.8px solid var(--bg);border-bottom:1.8px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}
.progress .d{font-size:12.5px;color:var(--faint)}
@media (prefers-reduced-motion:no-preference){.progress li.running .st{animation:pulse 1.1s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 5px var(--marker-soft)}}

/* Report */
.rep-head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s5);flex-wrap:wrap;padding-bottom:var(--s5);border-bottom:1px solid var(--line)}
.rep-head .t1{word-break:break-word}
.overview{display:grid;grid-template-columns:260px minmax(0,1fr);gap:var(--s7);padding:var(--s6) 0;border-bottom:1px solid var(--line)}
.overview .big{font:400 112px/.9 var(--f-ed);letter-spacing:-.04em}
.overview .big small{font:500 18px var(--f-ui);letter-spacing:0;color:var(--muted)}
.band{display:inline-block;margin-top:var(--s3);font-size:13px;padding:2px 8px;border-radius:999px;background:var(--marker-soft)}
@media (max-width:860px){.overview{grid-template-columns:1fr;gap:var(--s5)}.overview .big{font-size:88px}}
.rep-sec{padding:var(--s6) 0;border-bottom:1px solid var(--line)}
.rep-sec>h2{margin-bottom:var(--s4)}
.summary-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--s6)}
.summary-grid h3{font-size:14px;font-weight:600;margin-bottom:var(--s2)}
.summary-grid ul,.summary-grid ol{margin:0;padding-left:1.2em;display:grid;gap:6px}
@media (max-width:860px){.summary-grid{grid-template-columns:1fr}}
.strengths{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--s6)}
.strengths>div{padding:var(--s3) 0;border-bottom:1px solid var(--line)}
@media (max-width:760px){.strengths{grid-template-columns:1fr}}
.filters{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s4)}
.chip{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.issue{border-bottom:1px solid var(--line)}
.issue summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:var(--s3);padding:var(--s4) 0;align-items:start}
.issue summary::-webkit-details-marker{display:none}
.pri{font-weight:600;font-size:13px;padding:2px 0;border-radius:4px;text-align:center;border:1px solid var(--line-2)}
.pri.P1{background:var(--crit);border-color:var(--crit);color:#fff}
.pri.P2{border-color:var(--high);color:var(--high)}
.issue .ttl{font-weight:500}
.tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;font-size:12.5px;color:var(--muted)}
.sev{display:inline-flex;align-items:center;gap:5px}
.sev::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.sev.critical{--c:var(--crit)}.sev.high{--c:var(--high)}.sev.medium{--c:var(--med)}.sev.low{--c:var(--low)}
.issue .chev{color:var(--faint);transition:transform var(--dur)}
.issue[open] .chev{transform:rotate(90deg)}
.issue-body{padding:0 0 var(--s5) calc(44px + var(--s3));display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:var(--s5)}
.issue-body dl{margin:0;display:grid;gap:var(--s3)}
.issue-body dt{font-size:12.5px;color:var(--muted)}
.issue-body dd{margin:2px 0 0}
.issue-body ol{margin:4px 0 0;padding-left:1.2em}
.evidence{font-size:13px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-control);padding:8px 10px;word-break:break-word}
.issue-shot{border:1px solid var(--line);border-radius:var(--r-control);overflow:hidden;max-height:220px}
@media (max-width:760px){.issue-body{grid-template-columns:1fr;padding-left:0}.issue summary{grid-template-columns:36px minmax(0,1fr) auto}}
.catgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4)}
.catcard{padding:var(--s4) 0;border-top:1px solid var(--line)}
.catcard .row{justify-content:space-between}
.catcard .sc{font:400 28px/1 var(--f-ed)}
.subs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px;margin-top:var(--s2);font-size:12.5px;color:var(--muted)}
.subs span:nth-child(even){text-align:right;color:var(--text)}
@media (max-width:760px){.catgrid{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0 var(--s5)}
.kv>div{display:flex;justify-content:space-between;gap:var(--s3);padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500;text-align:right}
.swatches{display:flex;gap:4px;flex-wrap:wrap}.swatches i{width:18px;height:18px;border-radius:3px;border:1px solid var(--line)}
.shots{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:var(--s4);align-items:start}
.shots figure{margin:0;border:1px solid var(--line);border-radius:var(--r-panel);overflow:hidden;max-height:520px}
.shots figcaption{padding:6px 10px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);background:var(--panel)}
.notice{border:1px solid var(--line-2);border-left:3px solid var(--marker);border-radius:var(--r-control);padding:var(--s3) var(--s4);background:var(--panel);font-size:14px}
.notice.err{border-left-color:var(--crit)}
.compare{display:grid;grid-template-columns:repeat(3,auto) 1fr;gap:var(--s6);align-items:end}
.compare .n{font:400 40px/1 var(--f-ed)}
.up{color:var(--good)}.down{color:var(--crit)}
.auth{max-width:400px;margin:var(--s7) auto;display:grid;gap:var(--s4)}
.divider{display:flex;align-items:center;gap:var(--s3);color:var(--faint);font-size:12.5px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:var(--r-control);font-size:14px;z-index:50;box-shadow:var(--shadow)}
.lock{font-size:13px;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r-control);padding:8px 10px}

/* Print / PDF */
@media print{
  :root{--bg:#fff;--panel:#fff;--panel-2:#f6f6f6;--line:#ddd;--line-2:#bbb;--text:#111;--muted:#555;--faint:#888;--marker:#111}
  .top,.side,.no-print,.filters{display:none!important}
  .app{display:block}.main{padding:0;max-width:none}
  .issue{break-inside:avoid}.issue-body{display:block!important;padding-left:0}
  details>summary{list-style:none}
  body{font-size:12px}
}
</style>

riority":"P1","impact":"Low-vision users on mobile cannot enlarge text.","why":"The viewport meta tag sets user-scalable=no or maximum-scale=1.","recommendation":"Remove user-scalable=no and maximum-scale from the viewport tag.","steps":[],"evidence":{"type":"observed","detail":"width=device-width, initial-scale=1, maximum-scale=1"},"confidence":"high","view":null},{"id":"r-a11y.contrast","source":"rule","category":"accessibility","title":"Text color contrast below WCAG AA","severity":"high","priority":"P1","impact":"Text is hard to read for low-vision users and on bright screens.","why":"5 of 8 color pairs declared in CSS fall below 4.5:1 (worst 1.49:1).","recommendation":"Darken text or lighten backgrounds until body text reaches 4.5:1 and large text 3:1.","steps":[],"evidence":{"type":"observed","detail":".hl: #e0c9b0 on #fdf6ec = 1.49:1"},"confidence":"medium","view":null},{"id":"a-2","source":"ai","category":"responsive","title":"Mobile layout overflows horizontally","severity":"high","priority":"P1","impact":"Phone visitors must pan sideways and zoom out to read, and pinch-zoom is disabled.","why":"The .wrap container has a fixed 1200px width and the navigation has no small-screen pattern.","recommendation":"Make the container fluid (max-width: 1200px; width: 100%; padding-inline: 20px) and collapse the navigation into a menu button below 768px.","steps":["Change .wrap to max-width with fluid width and side padding.","Hide the inline nav below 768px and add a menu button that opens a full-height panel.","Stack the coffee cards in one column below 640px.","Remove maximum-scale=1 from the viewport tag."],"evidence":{"type":"observed","detail":"Mobile screenshot at 390px shows the page rendered at desktop width with truncated navigation."},"confidence":"high","view":"mobile"},{"id":"a-3","source":"ai","category":"ux","title":"Eleven equal navigation items bury the shop","severity":"medium","priority":"P2","impact":"Visitors scanning the header must read every label to find where to buy.","why":"Commerce, content and company pages share one flat list with identical styling.","recommendation":"Group the menu into Shop, Subscribe, Learn (Journal, Brew Guides), Visit (Cafés, Events) and About, and style Shop as the most prominent item.","steps":["Merge Journal and Brew Guides under Learn; Cafés and Events under Visit.","Move Gift Cards into Shop and Wholesale into the footer.","Add a cart icon with item count at the right edge."],"evidence":{"type":"observed","detail":"Header: Home | Shop | Subscriptions | Wholesale | Our Story | Journal | Brew Guides | Cafés | Events | Gift Cards | Contact."},"confidence":"high","view":"desktop"},{"id":"r-conv.cta_early","source":"rule","category":"conversion","title":"Primary CTA appears late in the page","severity":"medium","priority":"P2","impact":"Visitors who do not scroll never see the next step.","why":"The first action element appears 91% into the document.","recommendation":"Place the primary CTA in the first screen, next to the value proposition.","steps":[],"evidence":{"type":"observed","detail":"first CTA at 91% of markup"},"confidence":"medium","view":null},{"id":"r-conv.social_proof","source":"rule","category":"conversion","title":"No visible social proof","severity":"medium","priority":"P2","impact":"First-time visitors have little reason to trust the offer.","why":"No testimonials, reviews, client names or ratings were detected in the text.","recommendation":"Add 2–3 specific testimonials or recognizable client logos near the main CTA.","steps":[],"evidence":{"type":"observed","detail":"no social-proof keywords"},"confidence":"medium","view":null},{"id":"r-conv.form_length","source":"rule","category":"conversion","title":"Long form","severity":"medium","priority":"P2","impact":"Each additional field lowers the share of people who finish.","why":"The longest form has 9 fields.","recommendation":"Ask only what is needed now; collect the rest after the first conversion.","steps":[ /* ═══ Local persistence (local mode only) ═══ */
const local = {
  list: () => readJSON(LOCAL_KEY, []),
  get: (id) => local.list().find((a) => a.id === id),
  save(report) {
    const id = 'local-' + Date.now().toString(36);
    const entry = { id, url: report.url, domain: report.domain, score: report.overall.score, status: 'completed', createdAt: report.auditedAt, report };
    let list = [entry, ...local.list()].slice(0, 40);

  },

  clear() { localStorage.removeItem(LOCAL_KEY); },

  async getReport(rid) {

    return data ? { report: data.report_data, reportId: data.id, auditId: data.audit_id, isPublic: data.is_public, own: data.user_id === state.session?.user?.id } : null;

/* ═══ Audit runner — reads the SSE stream from the audit function ═══ */
class ClientError extends Error { constructor(code) { super(code); this.code = code; } }
async function streamAudit(url, onEvent) {
  const headers = { 'content-type': 'application/json' };
  if (HAS_SB) { headers.apikey = cfg.SUPABASE_ANON_KEY; headers.authorization = `Bearer ${state.session?.access_token || cfg.SUPABASE_ANON_KEY}`; }
  let res;
  try { res = await fetch(ENDPOINT, { method: 'POST', headers, body: JSON.stringify({ url, lang: state.lang }) }); }
  catch { throw new ClientError('NETWORK'); }
  if (!res.ok) { const j = await res.json().catch(() => ({})); throw new ClientError(j.code || (res.status === 429 ? 'RATE_LIMIT' : 'INTERNAL')); }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '', final = null;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      const ev = (chunk.match(/^event: (.*)$/m) || [])[1];
      const data = (chunk.match(/^data: (.*)$/m) || [])[1];
      if (!ev || !data) continue;
      const payload = JSON.parse(data);
      if (ev === 'error') throw new ClientError(payload.code || 'INTERNAL');
      if (ev === 'done') final = payload;
      onEvent(ev, payload);
    }
  }
  if (!final) throw new ClientError('INTERNAL');
  return final;
}

/* ═══ Router ═══ */
const routes = () => [
  ['/', viewLanding], ['/analyze', viewAnalyze], ['/pricing', viewPricing], ['/sample', viewSample],
  ['/login', viewLogin, { guest: true }], ['/signup', viewSignup, { guest: true }],
  ['/dashboard', viewDashboard, { app: true }], ['/audits', viewAudits, { app: true }], ['/audit/:id', viewAudit, { app: true }],
  ['/report/:id', viewReport], ['/settings', viewSettings, { app: true }], ['/account', viewAccount, { app: true }],
];
function match(path) {
  for (const [pat, fn, opt = {}] of routes()) {
    const keys = [];
    const re = new RegExp('^' + pat.replace(/:(\w+)/g, (_, k) => (keys.push(k), '([^/]+)')) + '/?$');
    const m = path.match(re);
    if (m) return { fn, opt, params: Object.fromEntries(keys.map((k, i) => [k, decodeURIComponent(m[i + 1])])) };
  }
  return { fn: viewNotFound, opt: {}, params: {} };
}
function navigate(to, replace = false) { history[replace ? 'replaceState' : 'pushState']({}, '', to); render(); }
window.addEventListener('popstate', render);
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href]');
  if (!a || a.target || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
  const href = a.getAttribute('href');
  if (!href.startsWith('/') || href.startsWith('//') || /\.\w+$/.test(href.split('?')[0])) return;
  e.preventDefault(); navigate(href);
});

let renderSeq = 0;
async function render() {
  const seq = ++renderSeq;
  applyTheme();
  const path = location.pathname;
  const { fn, opt, params } = match(path);
  const signedIn = isLocalMode() || !!state.session;
  if (opt.app && !signedIn) return navigate(`/login?next=${encodeURIComponent(path + location.search)}`, true);
  if (opt.guest && signedIn && !isLocalMode()) return navigate('/dashboard', true);
  renderTop(path, opt.app);
  const root = $('#root');
  const body = await fn(params, new URLSearchParams(location.search));
  if (seq !== renderSeq) return;
  root.innerHTML = opt.app ? appShell(path, body) : `<main id="main" class="page" tabindex="-1">${body}</main>${footer()}`;
  document.title = titleFor(path);
  window.scrollTo(0, 0);
  afterRender?.(); afterRender = null;
  animateScales();
}
let afterRender = null;
const titleFor = (p) => `${p === '/' ? '' : (t({ '/analyze': 'analyze.title', '/pricing': 'pricing.title', '/sample': 'nav.sample', '/dashboard': 'dash.title', '/audits': 'audits.title', '/settings': 'set.title', '/account': 'acct.title', '/login': 'auth.login', '/signup': 'auth.signup' }[p] || 'nav.audits') + ' — ')}${cfg.BRAND_NAME || 'AI Design & Website Auditor'}`;
function animateScales() {
  const go = () => document.querySelectorAll('.scale.pre').forEach((el) => el.classList.remove('pre'));
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return go();
  requestAnimationFrame(() => requestAnimationFrame(go));
}

async function startAudit(url) {
  if (state.running) return;
  if (location.pathname !== '/analyze') { navigate(`/analyze?url=${encodeURIComponent(url)}&go=1`); return; }
  state.running = true;
  const run = $('#run');
  const form = $('#an'); if (form) form.querySelector('button').disabled = true;
  const stages = ['fetch', 'structure', 'visual', 'ux', 'accessibility', 'recommendations', 'report'];
  run.innerHTML = `<div style="margin-top:var(--s6)"><h2 class="t2" aria-live="polite">${t('analyze.running')}</h2><p class="meta">${esc(url)}</p>
    <ol class="progress">${stages.map((s, i) => `<li id="st-${s}"><span class="n">0${i + 1}</span><span class="st"></span><span>${t('stage.' + s)}</span><span class="d"></span></li>`).join('')}</ol></div>`;
  try {
    const out = await streamAudit(url, (ev, p) => {
      if (ev !== 'stage') return;
      const li = $('#st-' + p.id); if (!li) return;
      li.className = p.status; if (p.detail) li.querySelector('.d').textContent = p.detail;
    });
    state.running = false;
    if (out.auditId) { await api.loadProfile(); navigate(`/audit/${out.auditId}`, true); return; }
    if (isLocalMode()) { const id = local.save(out.report); navigate(`/audit/${id}`, true); return; }
    state.lastReport = out.report;
    run.innerHTML = '';
    $('#anon-result').innerHTML = `<div class="notice" style="margin:var(--s5) 0">${t('analyze.anonNote')} <a href="/signup">${t('analyze.saveCta')}</a></div>${reportHtml(out.report, { mode: 'anon' })}`;
    animateScales();
  } catch (e) {
    state.running = false;
    if (form) form.querySelector('button').disabled = false;
    run.innerHTML = `<div class="notice err" style="margin-top:var(--s5)" role="alert">${esc(errMsg(e.code))}
      ${e.code === 'PLAN_LIMIT' ? ` <a href="/pricing">${t('nav.pricing')}</a>` : ''}${e.code === 'RATE_LIMIT' ? ` <a href="/signup">${t('auth.signup')}</a>` : ''}</div>`;
  }
}

/* ═══ Report ═══ */
function reportHtml(r, o = {}) {
  const { mode = 'app', prev = null, audit = null, reportId = null, isPublic = false } = o;
  const b = band(r.overall.score);
  const warnings = [...(r.warnings || []).filter((w) => I18N.en['warn.' + w]).map((w) => t('warn.' + w)), ...(r.engine?.name === 'mock' ? [t('warn.mock')] : [])];
  const canCompare = mode === 'app' && feat('compare');
  const actions = mode === 'app' || mode === 'public' ? `<div class="row no-print">
      ${mode === 'app' ? `<a class="btn sm" href="/analyze?url=${encodeURIComponent(r.url)}&go=1">${t('rep.rerun')}</a>` : ''}
      ${feat('pdf') || mode === 'public' ? `<button class="btn sm" data-action="print">${t('rep.print')}</button>` : ''}
      ${mode === 'app' && !isLocalMode() && reportId && feat('share') ? `<button class="btn sm" data-action="share" data-rid="${esc(reportId)}" data-on="${isPublic ? '1' : '0'}" aria-pressed="${isPublic}">${isPublic ? t('rep.shareOn') : t('rep.share')}</button>${isPublic ? `<button class="btn sm" data-action="copy" data-rid="${esc(reportId)}">${t('rep.copy')}</button>` : ''}` : ''}
      ${mode === 'app' && audit ? `<button class="btn sm ghost" data-action="delete" data-id="${esc(audit.id)}">${t('rep.delete')}</button>` : ''}
    </div>` : '';
  const pr = (r.summary.priorities || []).filter(Boolean);
  const compareBlock = mode !== 'app' ? '' : !prev ? '' : !canCompare ? `<div class="rep-sec"><p class="lock">${t('rep.lockedCompare')} <a href="/pricing">${t('nav.pricing')}</a></p></div>` : (() => {
    const d = r.overall.score - prev.overall.score;
    const moved = CATS.map((c) => [c, (r.categories[c]?.score ?? null), (prev.categories?.[c]?.score ?? null)]).filter(([, a, p]) => a != null && p != null && a !== p).sort((x, y) => Math.abs(y[1] - y[2]) - Math.abs(x[1] - x[2]));
    return `<section class="rep-sec"><h2 class="t2">${t('rep.compare')}</h2>
      <div class="compare"><div><div class="meta">${t('rep.prev')}</div><div class="n">${prev.overall.score}</div><div class="meta">${fmtDate(prev.auditedAt)}</div></div>
      <div><div class="meta">${t('rep.cur')}</div><div class="n">${r.overall.score}</div><div class="meta">${fmtDate(r.auditedAt)}</div></div>
      <div><div class="meta">${t('rep.change')}</div><div class="n ${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${d > 0 ? '+' : ''}${d}</div><div class="meta">&nbsp;</div></div>
      <div class="meta">${moved.slice(0, 6).map(([c, a, p]) => `${t('cat.' + c)} <span class="${a > p ? 'up' : 'down'}">${a > p ? '+' : ''}${a - p}</span>`).join(' &nbsp; ') }</div></div></section>`;
  })();
  const shots = r.screenshots || {};
  return `<article class="report">
    <header class="rep-head"><div><h1 class="t1">${esc(r.domain)}</h1><p class="meta" style="margin-top:6px"><a href="${esc(r.finalUrl || r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.finalUrl || r.url)}</a></p><p class="meta">${t('rep.audited', { d: fmtDate(r.auditedAt, true) })}</p></div>${actions}</header>
    ${warnings.length ? `<div style="display:grid;gap:8px;margin-top:var(--s4)">${warnings.map((w) => `<div class="notice">${esc(w)}</div>`).join('')}</div>` : ''}
    <section class="overview" aria-label="${t('rep.overall')}">
      <div><div class="meta">${t('rep.overall')}</div><div class="big">${r.overall.score}<small>/100</small></div><span class="band">${t('band.' + b)}</span><p class="meta" style="margin-top:var(--s3)">${t('rep.conf.' + r.overall.confidence)}</p>
        <p class="meta" style="margin-top:var(--s4)">${prev && canCompare ? `<span style="border-left:2px dotted var(--muted);padding-left:6px">${t('rep.prev')}</span>` : ''}</p></div>
      ${gauge(r, CATS, canCompare ? prev : null)}
    </section>
    ${compareBlock}
    <section class="rep-sec"><h2 class="t2">${t('rep.summary')}</h2>
      <div class="summary-grid"><p class="ed">${esc(r.summary.text)}</p>
      <div class="stack">
        ${r.summary.strengths?.length ? `<div><h3>${t('rep.strengths')}</h3><ul>${r.summary.strengths.map((s) => `<li>${esc(s)}</li>`).join('')}</ul></div>` : ''}
        ${r.summary.keyIssues?.length ? `<div><h3>${t('rep.keyIssues')}</h3><ul>${r.summary.keyIssues.map((s) => `<li>${esc(s)}</li>`).join('')}</ul></div>` : ''}
        ${pr.length ? `<div><h3>${t('rep.priority')}</h3><ol>${pr.map((s) => `<li>${esc(s)}</li>`).join('')}</ol></div>` : ''}
      </div></div></section>
    ${r.strengths?.length ? `<section class="rep-sec"><h2 class="t2">${t('rep.whatWorks')}</h2><div class="strengths">${r.strengths.map((s) => `<div><div style="font-weight:500">${esc(s.title)}</div><div class="meta">${esc(t('cat.' + s.category))}${s.detail ? ' — ' + esc(s.detail) : ''}</div></div>`).join('')}</div></section>` : ''}
    <section class="rep-sec"><h2 class="t2">${t('rep.issues')} <span class="muted" style="font-weight:400">${r.issues.length}</span></h2>
      <div class="filters" role="group" aria-label="Priority">${['all', 'P1', 'P2', 'P3'].map((p) => `<button class="chip" data-action="fpri" data-v="${p}" aria-pressed="${state.filter.pri === p}">${p === 'all' ? t('rep.all') : `${p} ${t('pri.' + p)} (${r.issues.filter((i) => i.priority === p).length})`}</button>`).join('')}</div>
      <div class="filters" role="group" aria-label="Category"><button class="chip" data-action="fcat" data-v="all" aria-pressed="${state.filter.cat === 'all'}">${t('rep.all')}</button>${CATS.filter((c) => r.issues.some((i) => i.category === c)).map((c) => `<button class="chip" data-action="fcat" data-v="${c}" aria-pressed="${state.filter.cat === c}">${t('cat.' + c)}</button>`).join('')}</div>
      <div id="issues">${issuesHtml(r)}</div></section>
    ${shots.desktop || shots.mobile ? `<section class="rep-sec"><h2 class="t2">${t('rep.evidence')}</h2><div class="shots">${shots.desktop ? `<figure><img src="${esc(shots.desktop)}" alt="${esc(r.domain)} — ${t('rep.desktop')}" loading="lazy"><figcaption>${t('rep.desktop')} 1440px</figcaption></figure>` : '<div></div>'}${shots.mobile ? `<figure><img src="${esc(shots.mobile)}" alt="${esc(r.domain)} — ${t('rep.mobile')}" loading="lazy"><figcaption>${t('rep.mobile')} 390px</figcaption></figure>` : ''}</div></section>` : ''}
    <section class="rep-sec"><h2 class="t2">${t('rep.categories')}</h2><div class="catgrid">${CATS.map((c) => catCard(r, c)).join('')}</div></section>
    ${technicalHtml(r)}
  </article>`;
}
function issuesHtml(r) {
  window.__rep = r;
  const list = r.issues.filter((i) => (state.filter.pri === 'all' || i.priority === state.filter.pri) && (state.filter.cat === 'all' || i.category === state.filter.cat));
  if (!list.length) return `<p class="muted" style="padding:var(--s4) 0">${t('rep.noIssues')}</p>`;
  return list.map((i) => {
    const shot = i.view && r.screenshots?.[i.view];
    return `<details class="issue"><summary><span class="pri ${i.priority}" title="${esc(t('pri.' + i.priority))}">${i.priority}</span>
      <div><div class="ttl">${esc(i.title)}</div><div class="tags"><span class="sev ${i.severity}">${t('sev.' + i.severity)}</span><span>${esc(t('cat.' + i.category))}</span><span>${t('rep.source.' + i.source)}</span><span>${t('rep.conf.' + i.confidence)}</span></div></div><span class="chev" aria-hidden="true">›</span></summary>
      <div class="issue-body"><dl>
        ${i.impact ? `<div><dt>${t('rep.impact')}</dt><dd>${esc(i.impact)}</dd></div>` : ''}

function catCard(r, c) {
  const x = r.categories[c] || {};

function technicalHtml(r) {

    <div class="row" style="margin-top:var(--s4);align-items:flex-start;gap:var(--s6)">

  </section>`;
}

document.addEventListener('submit', async (e) => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form;
  if (kind === 'audit') {
    const input = f.querySelector('input[name=url]');
    const url = validUrl(input.value);
    const err = $('#' + f.id + '-err');
    if (!url) { err.textContent = t('err.INVALID_URL'); err.hidden = false; input.setAttribute('aria-invalid', 'true'); input.focus(); return; }
    err.hidden = true; input.removeAttribute('aria-invalid');
    const raw = input.value.trim();
    if (location.pathname === '/analyze') { history.replaceState({}, '', `/analyze?url=${encodeURIComponent(raw)}`); startAudit(raw); }
    else navigate(`/analyze?url=${encodeURIComponent(raw)}&go=1`);
  }
  if (kind === 'login' || kind === 'signup') {
    const fd = new FormData(f), err = $('#auth-err');
    const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
    const { error, data } = kind === 'login'
      ? await sb.auth.signInWithPassword({ email: fd.get('email'), password: fd.get('password') })
      : await sb.auth.signUp({ email: fd.get('email'), password: fd.get('password'), options: { data: { full_name: fd.get('name') || '' }, emailRedirectTo: location.origin + '/dashboard' } });
    btn.disabled = false;
    if (error) { err.textContent = t('auth.fail', { m: error.message }); err.hidden = false; return; }
    if (kind === 'signup' && !data.session) { err.textContent = t('auth.check'); err.hidden = false; err.style.color = 'var(--good)'; return; }
    state.session = data.session; await api.loadProfile(); navigate(f.dataset.next || '/dashboard', true);
  }
  if (kind === 'account') {
    const name = new FormData(f).get('name');
    const { error } = await sb.from('profiles').update({ name, locale: state.lang }).eq('id', state.session.user.id);
    toast(error ? error.message : t('acct.saved'));
  }
});

    state.filter[act === 'fpri' ? 'pri' : 'cat'] = el.dataset.v;
    el.parentElement.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', c === el));
    $('#issues').innerHTML = issuesHtml(window.__rep);
  }
  if (act === 'print') { document.querySelectorAll('details.issue').forEach((d) => (d.open = true)); window.print(); }
  if (act === 'share') {
    const on = el.dataset.on !== '1';
    try { await api.setShare(el.dataset.rid, on); render(); } catch (err) { toast(err.message); }
  }
  if (act === 'copy') { await navigator.clipboard?.writeText(`${location.origin}/report/${el.dataset.rid}`); toast(t('rep.copied')); }
  if (act === 'delete') { if (!confirm(t('confirmDelete'))) return; try { await api.deleteAudit(el.dataset.id); navigate('/audits', true); } catch (err) { toast(err.message); } }
  if (act === 'clear-local') { local.clear(); toast(t('set.cleared')); render(); }
  if (act === 'google') { const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + (el.dataset.next || '/dashboard') } }); if (error) toast(error.message); }
  if (act === 'signout') { e.preventDefault(); await sb.auth.signOut(); state.session = null; state.profile = null; navigate('/', true); }
});

/* ═══ Boot ═══ */
if (sb) {
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  await api.loadProfile().catch(() => {});
  sb.auth.onAuthStateChange(async (evt, session) => {
    const changed = (session?.access_token || null) !== (state.session?.access_token || null);
    state.session = session;
    if (evt === 'SIGNED_IN' || evt === 'SIGNED_OUT') { await api.loadProfile().catch(() => {}); if (changed) render(); }
  });
}
render();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
</html>
